<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes secretos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-center items-center p-4 transition-colors duration-300">

    <!-- WEB WIDTH CONTROLLER -->
    <main class="w-full max-w-5xl flex flex-col items-center">
        
        <!-- Header Info / Theme Switcher -->
        <!-- <header class="w-full max-w-md flex justify-between items-center mb-4 px-2">
            <div class="flex items-center gap-2 text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider font-semibold">
                <i class="fa-solid fa-shield-halved text-brand-500"></i>
                <span>Mensajes Ocultos</span>
            </div>
            <button id="themeToggle" class="p-2 rounded-lg bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:text-brand-500 transition-all">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
            </button>
        </header> -->

        <!-- MAX WIDTH FROM MOBILE CONTAINER (Wireframe Center Block) -->
        <div class="w-full h-full max-w-lg bg-white dark:bg-slate-900 rounded-3xl shadow-xl border border-slate-200/80 dark:border-slate-800 p-5 sm:p-6 space-y-6 transition-all">
            
            <!-- WIREFRAME TOP CARD: HIDE SENT MESSAGE -->
            <div class="w-full py-3.5 px-4 bg-gradient-to-r from-brand-600 to-indigo-700 dark:from-brand-600 dark:to-indigo-800 rounded-2xl shadow-md text-center">
                <h1 class="text-xl font-bold tracking-wider text-white uppercase flex items-center justify-center gap-2">
                    <i class="fa-solid fa-eye-slash text-indigo-200"></i>
                    MENSAJES SECRETOS
                </h1>
            </div>

            <!-- Tab Switcher (Ocultar vs Revelar) -->
            <div class="flex p-1 bg-slate-100 dark:bg-slate-800 rounded-xl">
                <button id="tabHideBtn" onclick="switchTab('hide')" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all shadow-sm bg-white dark:bg-slate-700 text-brand-600 dark:text-indigo-300">
                    <i class="fa-solid fa-lock mr-1"></i> Ocultar
                </button>
                <button id="tabRevealBtn" onclick="switchTab('reveal')" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200">
                    <i class="fa-solid fa-lock-open mr-1"></i> Revelar
                </button>
            </div>

            <!-- SECTION 1: HIDE MESSAGE (ENCODER) -->
            <div id="sectionHide" class="space-y-4">
                
                <!-- Secret Message Input -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-2">
                        1. Mensaje Secreto a Ocultar
                    </label>
                    <textarea id="secretInput" rows="3" class="w-full p-3 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all custom-scrollbar resize-none" placeholder="Escribe aquí tu mensaje secreto..."></textarea>
                </div>

                <!-- Cover Text / Placeholder Option -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-2">
                        2. Texto de Cobertura Visible
                    </label>
                    <input id="coverInput" type="text" value="" class="w-full p-3 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-slate-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all" placeholder="Texto público que verán los demás...">
                </div>

                <!-- Action Button -->
                <button onclick="btn_encapsular_mensaje()" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Encapsular Mensaje
                </button>

                <!-- Wireframe Result Output Box (With Copiar Button) -->
                <div class="pt-2">
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-2">
                        Resultado Esteganográfico
                    </label>
                    <div class="relative p-4 rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/30 flex flex-col justify-between gap-3 min-h-[90px]">
                        <p id="encodedOutputDisplay" class="text-sm font-medium text-slate-700 dark:text-slate-300 break-all leading-relaxed">
                            <span class="text-slate-400 dark:text-slate-500 italic">El resultado aparecerá aquí...</span>
                        </p>
                        
                        <!-- Wireframe "COPIAR" button at bottom right -->
                        <div class="flex justify-end pt-1">
                            <button id="copyBtn" onclick="copyResult()" disabled class="px-4 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-brand-600 hover:text-white dark:hover:bg-brand-600 text-slate-700 dark:text-slate-200 text-xs font-bold rounded-xl transition-all flex items-center gap-2 opacity-50 cursor-not-allowed">
                                <i class="fa-regular fa-copy"></i> COPIAR
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SECTION 2: REVEAL MESSAGE (DECODER) -->
            <div id="sectionReveal" class="space-y-4 hidden">
                
                <!-- Encrypted Input Box with Wireframe 'Mostrar' Button -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-2">
                        Pegar Texto con Mensaje Oculto
                    </label>
                    <div class="relative">
                        <textarea id="revealInput" rows="3" class="w-full p-3 pr-24 text-sm rounded-2xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all custom-scrollbar resize-none" placeholder="Pega aquí el texto recibido"></textarea>

                        <button onclick="document.getElementById('revealInput').value=''" class="absolute right-2 top-2 px-3.5 py-2 bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold rounded-xl shadow transition-all flex items-center gap-1.5 active:scale-95">
                            <i class="fa-solid fa-brush"></i> Limpiar
                        </button>
                    </div>
                </div>
                <!-- Action Button -->
                <button onclick="btn_revelar_mensaje()" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                    <i class="fa-solid fa-eye"></i> Revelar Mensaje
                </button>

                <!-- Wireframe Card Displaying Revealed Message / Dynamic Toggle -->
                <div id="decodedContainer" class="p-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                            Estado de Revelación
                        </span>
                        <!-- Wireframe 'Ocultar' button -->
                        <button id="toggleVisibleBtn" onclick="toggleSecretVisibility()" class="px-3 py-1 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 text-xs font-semibold rounded-lg transition-all hidden">
                            <i class="fa-solid fa-eye-slash mr-1"></i> Ocultar
                        </button>
                    </div>

                    <div class="min-h-[60px] flex items-center justify-center p-3 bg-white dark:bg-slate-900 rounded-xl border border-slate-100 dark:border-slate-800">
                        <p id="decodedOutputText" class="text-sm font-semibold text-center text-slate-400 dark:text-slate-500 italic">
                            Aún no has revelado ningún mensaje.
                        </p>
                    </div>
                </div>
            </div>

        </div>

        <!-- Footer Footer notes -->
        <!-- <footer class="mt-6 text-center text-xs text-slate-400 dark:text-slate-600">
            Esteganografía con caracteres Unicode de ancho cero (&ZeroWidthSpace;)
        </footer> -->
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-4 py-2.5 rounded-xl shadow-2xl text-xs font-medium flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 dark:text-emerald-600"></i>
        <span id="toastMsg">Copiado al portapapeles</span>
    </div>

    <script>
        // --- Zero-Width Character Steganography Engine ---
        // Binary to Zero-Width mapping
        const ZERO_WIDTH_ZERO = '\u200B'; // Zero-Width Space
        const ZERO_WIDTH_ONE = '\u200C';  // Zero-Width Non-Joiner
        const ZERO_WIDTH_SPACE = '\u200D';// Zero-Width Joiner

        function textToBinary(text) {
            return text.split('').map(char => {
                return char.charCodeAt(0).toString(2).padStart(16, '0');
            }).join('');
        }

        function binaryToText(binary) {
            const chars = binary.match(/.{1,16}/g) || [];
            return chars.map(bin => String.fromCharCode(parseInt(bin, 2))).join('');
        }

        function hideText(cover, secret) {
            if (!secret) return cover;
            const binary = textToBinary(secret);
            const hiddenUnicode = binary.split('').map(bit => {
                return bit === '1' ? ZERO_WIDTH_ONE : ZERO_WIDTH_ZERO;
            }).join('');

            // Embed hidden characters right after the first character or at the beginning
            if (cover.length > 0) {
                return cover.charAt(0) + hiddenUnicode + cover.slice(1);
            }
            return hiddenUnicode;
        }

        function extractText(encodedText) {
            let binary = '';
            for (let i = 0; i < encodedText.length; i++) {
                const char = encodedText[i];
                if (char === ZERO_WIDTH_ZERO) {
                    binary += '0';
                } else if (char === ZERO_WIDTH_ONE) {
                    binary += '1';
                }
            }
            if (!binary || binary.length % 16 !== 0) return null;
            try {
                return binaryToText(binary);
            } catch (e) {
                return null;
            }
        }

        // --- Application State & UI Controllers ---
        let currentEncodedMessage = "";
        let currentDecodedSecret = "";
        let isSecretVisible = false;

        // Theme Toggle Functionality
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // Tab Switching Logic
        function switchTab(tab) {
            const hideBtn = document.getElementById('tabHideBtn');
            const revealBtn = document.getElementById('tabRevealBtn');
            const secHide = document.getElementById('sectionHide');
            const secReveal = document.getElementById('sectionReveal');

            if (tab === 'hide') {
                secHide.classList.remove('hidden');
                secReveal.classList.add('hidden');
                
                hideBtn.className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all shadow-sm bg-white dark:bg-slate-700 text-brand-600 dark:text-indigo-300";
                revealBtn.className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200";
            } else {
                secHide.classList.add('hidden');
                secReveal.classList.remove('hidden');

                revealBtn.className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all shadow-sm bg-white dark:bg-slate-700 text-brand-600 dark:text-indigo-300";
                hideBtn.className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200";
            }
        }

        // Copy Action
        function copyResult() {
            if (!currentEncodedMessage) return;

            // Using fallback copy method for iframe compatibility
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = currentEncodedMessage;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            
            try {
                document.execCommand('copy');
                showToast("¡Copiado al portapapeles!");
            } catch (err) {
                showToast("Error al copiar", "fa-xmark", "text-red-400");
            }
            document.body.removeChild(tempTextArea);
        }

        // Toggle Secret Visibility ("Ocultar" button)
        function toggleSecretVisibility() {
            isSecretVisible = !isSecretVisible;
            updateDecodedView();
        }

        function updateDecodedView() {
            const outputText = document.getElementById('decodedOutputText');
            const toggleBtn = document.getElementById('toggleVisibleBtn');

            if (isSecretVisible) {
                outputText.innerText = currentDecodedSecret;
                outputText.className = "text-sm font-semibold text-emerald-600 dark:text-emerald-400 text-center break-all";
                toggleBtn.innerHTML = '<i class="fa-solid fa-eye-slash mr-1"></i> Ocultar';
            } else {
                outputText.innerText = "• • • • • • • • • • • (Mensaje Oculto)";
                outputText.className = "text-sm font-semibold text-slate-400 dark:text-slate-500 text-center tracking-widest";
                toggleBtn.innerHTML = '<i class="fa-solid fa-eye mr-1"></i> Mostrar';
            }
        }

        // Toast Feedback helper
        function showToast(message, iconClass = "fa-circle-check", iconColor = "text-emerald-400 dark:text-emerald-600") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = message;
            toastIcon.className = `fa-solid ${iconClass} ${iconColor}`;

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
    <script src="main.js"></script>
</body>
</html>
